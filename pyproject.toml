[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spain-housing-access-agent"
version = "0.1.0"
description = "An A2A agent for researching housing access in Spain"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "a2a-sdk[http-server]==1.2.1",
    "httpx==0.28.1",
    "langchain==1.4.6",
    "langchain-openai==1.6.7",
    "langfuse==4.16.0",
    "langgraph==1.2.12",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
]

[project.scripts]
housing-access-agent = "housing_access_agent.server:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: needs the configured language model or a Brave Search API key; run with `pytest -m live`"]
