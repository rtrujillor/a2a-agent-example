<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a la vivienda en España</title>
    <script>
      // Applies the saved theme before first paint, so the wrong theme never
      // flashes. Mirrors src/stores/theme.ts: key 'theme', values 'light',
      // 'dark', or 'auto' (system); anything else, or no storage, means system.
      ;(function () {
        var saved
        try {
          saved = window.localStorage.getItem('theme')
        } catch (e) {}
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
